version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Production Managed Database Container
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: toeic_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toeic_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-toeic_pro_prod}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toeic_admin} -d ${POSTGRES_DB:-toeic_pro_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ----------------------------------------------------------------------------
  # TOEIC PRO Next.js Application Container
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toeic_prod_web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-toeic_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-toeic_pro_prod}?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma db push &&
        node server.js
      "
    networks:
      - backend
      - frontend

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy with SSL / Cache
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: toeic_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - frontend

volumes:
  prod_pgdata:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
